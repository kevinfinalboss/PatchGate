name: Bug report
description: Something is not working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security vulnerabilities must not be reported here** — see SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core, aws provider, catalog, docs, ci, other]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy in single-account mode
        2. Launch an instance with Patchgate:Profile=...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Patchgate version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Single/multi-account, region, OS/AMI of the instance"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove account IDs, secrets and personal data before pasting.
      render: shell
