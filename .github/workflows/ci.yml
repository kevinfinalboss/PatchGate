name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - name: mypy
        run: |
          mypy core/lib core/tests core/scripts/linux providers/aws/tests
          for fn in providers/aws/functions/*/; do mypy "$fn"; done
      - name: core/ must not import cloud SDKs
        run: "! grep -rnE '^\\s*(import|from)\\s+(boto3|botocore|azure)' core --include='*.py'"
      - name: Validate catalog
        run: python -m patchgate validate
      - name: Generated artifacts are up to date
        run: python providers/aws/stacksets/generate.py --check
      - run: pytest

  powershell:
    name: PowerShell (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze Windows scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path core/scripts/windows -Recurse -Severity Warning,Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

  terraform:
    name: Terraform (fmt, validate, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive providers examples
      - name: validate
        run: |
          for d in $(find providers examples -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "==> $d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate -no-color
          done
      - name: shellcheck
        run: find core/scripts providers/aws/scripts -name '*.sh' -print0 | xargs -0 -r shellcheck
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive --minimum-failure-severity=warning

  security:
    name: Security (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov==3.4.5  # keep in sync with CHECKOV_VERSION in the Makefile
      - run: checkov -d . --config-file .checkov.yaml
