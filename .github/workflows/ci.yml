name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - name: mypy
        run: |
          paths=$(for p in core providers/aws/functions; do find "$p" -name '*.py' -print -quit | grep -q . && echo "$p"; done)
          if [ -n "$paths" ]; then mypy $paths; fi
      - name: core/ must not import cloud SDKs
        run: "! grep -rnE '^\\s*(import|from)\\s+(boto3|botocore|azure)' core --include='*.py'"
      - run: pytest

  terraform:
    name: Terraform (fmt, validate, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive providers
      - name: validate
        run: |
          for d in $(find providers -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "==> $d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate -no-color
          done
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive --minimum-failure-severity=warning

  security:
    name: Security (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      - run: checkov -d . --config-file .checkov.yaml
