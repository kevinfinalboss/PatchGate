[project]
name = "patchgate"
version = "0.0.0"
description = "Cloud-agnostic platform to harden, bootstrap and patch Linux & Windows fleets."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[project.scripts]
patchgate-cli = "patchgate_aws.cli:main"

[project.optional-dependencies]
aws = ["boto3>=1.35"]
dev = [
  "boto3>=1.35",
  "moto[ec2,ssm,sts,s3]>=5.0",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML",
  "types-jsonschema",
  "checkov>=3.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["patchgate", "patchgate_aws"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"providers/aws/stacksets/generate.py" = ["E501"]  # long literal strings in generated templates
"providers/aws/functions/approvals/handler.py" = ["E501"]  # inline HTML/CSS of the approval page

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["core/tests", "providers/aws/tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "patchgate" = "core/lib/patchgate", "patchgate_aws" = "providers/aws/lib/patchgate_aws" }
packages = ["patchgate", "patchgate_aws"]
