apiVersion: patchgate.io/v1alpha1
kind: Profile
metadata:
  name: web-windows
  description: Windows web server with admin tooling.
spec:
  platform: windows
  agents: [cloudwatch-agent, microsoft-defender]
  chocolatey:
    - name: 7zip
    - name: notepadplusplus
  ring: 1
  hardening:
    engine: controls
    level: baseline
  drift:
    interval: 30m
    mode: enforce
