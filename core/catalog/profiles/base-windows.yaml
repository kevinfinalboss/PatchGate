apiVersion: patchgate.io/v1alpha1
kind: Profile
metadata:
  name: base-windows
  description: Minimum baseline for any Windows server.
spec:
  platform: windows
  agents: [cloudwatch-agent, microsoft-defender]
  chocolatey:
    - name: 7zip
  ring: 0
  hardening:
    engine: controls
    level: baseline
  drift:
    interval: 30m
    mode: enforce
