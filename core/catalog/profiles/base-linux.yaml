apiVersion: patchgate.io/v1alpha1
kind: Profile
metadata:
  name: base-linux
  description: Minimum baseline for any Linux server.
spec:
  platform: linux
  agents: [cloudwatch-agent, clamav]
  ring: 0
  hardening:
    engine: controls
    level: baseline
  drift:
    interval: 30m
    mode: enforce
