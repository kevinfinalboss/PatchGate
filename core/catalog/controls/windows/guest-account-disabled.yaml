apiVersion: patchgate.io/v1alpha1
kind: Control
metadata:
  name: guest-account-disabled
  description: The built-in Guest account is disabled
  references:
    cis: 2.3.1.2
spec:
  platform: windows
  level: baseline
  check: $g = Get-LocalUser | Where-Object { $_.SID -like '*-501' }; if ($g -and $g.Enabled) { exit 1 } else { exit 0 }
  remediate: |
    Get-LocalUser | Where-Object { $_.SID -like '*-501' } | Disable-LocalUser
