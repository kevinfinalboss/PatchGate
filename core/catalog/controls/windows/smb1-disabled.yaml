apiVersion: patchgate.io/v1alpha1
kind: Control
metadata:
  name: smb1-disabled
  description: SMBv1 server protocol is disabled
  references:
    cis: 18.4.2
spec:
  platform: windows
  level: baseline
  check: if ((Get-SmbServerConfiguration).EnableSMB1Protocol) { exit 1 } else { exit 0 }
  remediate: |
    Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force
