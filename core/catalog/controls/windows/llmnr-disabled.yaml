apiVersion: patchgate.io/v1alpha1
kind: Control
metadata:
  name: llmnr-disabled
  description: LLMNR multicast name resolution is disabled
  references:
    cis: 18.6.4.4
spec:
  platform: windows
  level: baseline
  check: if ((Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name 'EnableMulticast' -ErrorAction SilentlyContinue).'EnableMulticast' -eq 0) { exit 0 } else { exit 1 }
  remediate: |
    if (-not (Test-Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient')) { New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Force | Out-Null }
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' -Name 'EnableMulticast' -Value 0 -Type DWord
