apiVersion: patchgate.io/v1alpha1
kind: Control
metadata:
  name: ssh-disable-password-auth
  description: SSH password authentication is disabled
  references:
    cis: 5.2.12
spec:
  platform: linux
  level: baseline
  check: sshd -T 2>/dev/null | grep -qi '^passwordauthentication no$'
  remediate: |
    f=/etc/ssh/sshd_config.d/01-patchgate-ssh-disable-password-auth.conf
    # sshd uses the first value it reads: neutralise the directive anywhere else first.
    for other in /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf; do
      if [ -f "$other" ] && [ "$other" != "$f" ]; then
        sed -i -E 's/^[[:space:]]*(PasswordAuthentication)[[:space:]]+/# disabled by patchgate: \1 /I' "$other"
      fi
    done
    echo 'PasswordAuthentication no' > "$f"
    if ! sshd -t; then rm -f "$f"; echo "sshd config invalid; reverted" >&2; exit 1; fi
    systemctl reload sshd 2>/dev/null || systemctl reload ssh
