apiVersion: patchgate.io/v1alpha1
kind: Control
metadata:
  name: shadow-file-permissions
  description: /etc/shadow is owned by root and not readable by others
  references:
    cis: 6.1.3
spec:
  platform: linux
  level: baseline
  check: '[ "$(stat -c %U /etc/shadow)" = root ] && [ $(( 0$(stat -c %a /etc/shadow) & 0137 )) -eq 0 ]'
  remediate: |
    chown root /etc/shadow
    chmod u-x,g-wx,o-rwx /etc/shadow
