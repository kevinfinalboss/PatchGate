apiVersion: patchgate.io/v1alpha1
kind: Control
metadata:
  name: ssh-max-auth-tries
  description: SSH MaxAuthTries is 4 or less
  references:
    cis: 5.2.7
spec:
  platform: linux
  level: baseline
  check: sshd -T 2>/dev/null | grep -qi '^maxauthtries 4$'
  remediate: |
    f=/etc/ssh/sshd_config.d/01-patchgate-ssh-max-auth-tries.conf
    echo 'MaxAuthTries 4' > "$f"
    if ! sshd -t; then rm -f "$f"; echo "sshd config invalid; reverted" >&2; exit 1; fi
    systemctl reload sshd 2>/dev/null || systemctl reload ssh
