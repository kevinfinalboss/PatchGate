apiVersion: patchgate.io/v1alpha1
kind: Control
metadata:
  name: ssh-disable-root-login
  description: SSH root login is disabled
  references:
    cis: 5.2.10
spec:
  platform: linux
  level: baseline
  check: sshd -T 2>/dev/null | grep -qi '^permitrootlogin no$'
  remediate: |
    f=/etc/ssh/sshd_config.d/01-patchgate-ssh-disable-root-login.conf
    echo 'PermitRootLogin no' > "$f"
    if ! sshd -t; then rm -f "$f"; echo "sshd config invalid; reverted" >&2; exit 1; fi
    systemctl reload sshd 2>/dev/null || systemctl reload ssh
