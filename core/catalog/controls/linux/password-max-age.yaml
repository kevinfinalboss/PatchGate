apiVersion: patchgate.io/v1alpha1
kind: Control
metadata:
  name: password-max-age
  description: New accounts' passwords expire within 365 days
  references:
    cis: 5.5.1.1
spec:
  platform: linux
  level: cis-level1
  check: awk '/^PASS_MAX_DAYS/ {found=1; if ($2 > 365 || $2 < 1) bad=1} END {exit (!found || bad)}' /etc/login.defs
  remediate: |
    if grep -q '^PASS_MAX_DAYS' /etc/login.defs; then sed -i 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS 365/' /etc/login.defs; else echo 'PASS_MAX_DAYS 365' >> /etc/login.defs; fi
