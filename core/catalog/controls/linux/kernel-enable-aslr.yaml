apiVersion: patchgate.io/v1alpha1
kind: Control
metadata:
  name: kernel-enable-aslr
  description: Address space layout randomization is enabled
  references:
    cis: 1.5.3
spec:
  platform: linux
  level: baseline
  check: '[ "$(sysctl -n kernel.randomize_va_space)" = "2" ]'
  remediate: |
    cat > /etc/sysctl.d/60-patchgate-kernel-enable-aslr.conf <<'EOF'
    kernel.randomize_va_space = 2
    EOF
    sysctl -qw kernel.randomize_va_space=2
