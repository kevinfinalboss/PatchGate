apiVersion: patchgate.io/v1alpha1
kind: Baseline
metadata:
  name: windows2022-cis-level1
  description: CIS Microsoft Windows Server 2022 Member Server Level 1 via the CISDSC module.
  references:
    benchmark: CIS Microsoft Windows Server 2022 Benchmark (Member Server, 21H2)
    upstream: https://www.powershellgallery.com/packages/CISDSC
spec:
  engine: dsc
  platform: windows
  # Module versions must match what the composite resource imports (AuditPolicyDSC 1.4.0.0,
  # SecurityPolicyDSC 2.10.0.0). Every package is verified by sha256 before installation.
  modules:
    - name: CISDSC
      version: 4.0.1
      source: https://www.powershellgallery.com/api/v2/package/CISDSC/4.0.1
      sha256: bf5bd09e0289f5733ee88abb6e038fea11802a00ca3188a3aad30f92b998534b
    - name: AuditPolicyDsc
      version: 1.4.0.0
      source: https://www.powershellgallery.com/api/v2/package/AuditPolicyDsc/1.4.0.0
      sha256: 6754aa6b20322ad4ab90faba310e583b6a13288940dd96594b75fcc712a1bcbb
    - name: SecurityPolicyDsc
      version: 2.10.0.0
      source: https://www.powershellgallery.com/api/v2/package/SecurityPolicyDsc/2.10.0.0
      sha256: b64c2777343f19ae2ba2fcc2a8981420d61b0993bd428c005eceef8293daeadd
  resource:
    module: CISDSC
    name: CIS_Microsoft_Windows_Server_2022_Member_Server_Release_21H2
  # The module refuses to compile unless rules 2.3.1.5, 2.3.1.6, 2.3.7.4 and 2.3.7.5 either get a
  # value or are excluded explicitly.
  parameters:
    LevelOne: true
    LevelTwo: false
    cis2316AccountsRenameguestaccount: pg-guest
    cis2375LegalNoticeCaption: Authorized use only
    cis2374LegalNoticeText: >-
      This system is for authorized use only. Activity is monitored and logged.
      Unauthorized access is prohibited and may be prosecuted.
  # Documented exceptions (CIS rule IDs):
  exclude:
    - "2.3.1.1" # Disable Administrator: the only local admin on EC2; Windows refuses and it would lock out access
    - "2.3.1.5" # Rename Administrator: EC2Launch password retrieval and AWS tooling expect "Administrator"
